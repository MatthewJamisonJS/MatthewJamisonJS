name: Update PR Count

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      full_count:
        description: 'Total merged PR count (authenticated, includes private repos)'
        required: false
        type: number
      cph_updated_at:
        description: 'Date of full count update (YYYY-MM-DD)'
        required: false
        type: string

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get public PR count
        id: public_count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/search/issues?q=author:MatthewJamisonJS+is:pr+is:merged&per_page=1")
          echo "count=$(echo "$RESPONSE" | jq '.total_count')" >> "$GITHUB_OUTPUT"

      - name: Build pr-count.json
        run: |
          PUBLIC=$(jq -n '${{ steps.public_count.outputs.count }}')

          # Use workflow_dispatch input if provided, otherwise keep existing cph_count
          if [ -n "${{ inputs.full_count }}" ]; then
            CPH=${{ inputs.full_count }}
            UPDATED_AT="${{ inputs.cph_updated_at }}"
          else
            CPH=$(jq '.cph_count // 0' pr-count.json)
            UPDATED_AT=$(jq -r '.cph_updated_at // ""' pr-count.json)
          fi

          TOTAL=$CPH

          jq -n \
            --argjson count "$TOTAL" \
            --argjson public_count "$PUBLIC" \
            --argjson cph_count "$CPH" \
            --arg cph_updated_at "$UPDATED_AT" \
            '{count: $count, public_count: $public_count, cph_count: $cph_count, cph_updated_at: $cph_updated_at}' \
            > pr-count.json

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr-count.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update pr count" && git push)
